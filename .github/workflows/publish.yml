name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-installer:
    name: Build macOS installer
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build installer artifacts
        run: OUTPUT_DIR=dist/macos packaging/macos/build_installer.sh

      - name: Smoke test fresh installer path
        run: packaging/macos/smoke_check.sh --install dist/macos/*.pkg

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moodtag-macos-arm64
          path: |
            dist/macos/*.pkg
            dist/macos/*.dmg
          if-no-files-found: error

  publish-macos-release:
    name: Attach macOS installers to GitHub Release
    needs: macos-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: moodtag-macos-arm64
          path: dist/macos

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/macos/*.pkg dist/macos/*.dmg --clobber

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distributions
        run: uv run --no-project --with twine -- python -m twine check dist/*

      - name: Smoke test wheel command
        run: uv run --no-project --with "dist/eagle_app_agent-"*.whl -- moodtag --help

      - name: Publish distributions
        run: uv publish --trusted-publishing always
