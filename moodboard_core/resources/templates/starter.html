<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{PROJECT_TITLE}}</title>
  <meta name="moodboard-project-id" content="{{PROJECT_ID}}">
  <meta name="moodboard-project-dir" content="{{PROJECT_DIR_NAME}}">
  <meta name="moodboard-created-at" content="{{PROJECT_CREATED_AT}}">
  <meta name="moodboard-updated-at" content="{{PROJECT_UPDATED_AT}}">
  <!--
    Moodboard Explore contract:
    - create_project.py renders PROJECT_* placeholders only when the project is first created.
    - Future skill runs replace only the body element contents.
    - The document head is a stable technical shell; project-specific visual design belongs in body.
  -->
  <style>
    @layer reset, base, utilities, theme, components;

    @layer reset {
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      figure,
      blockquote,
      dl,
      dd {
        margin: 0;
      }
    }

    @layer base {
      :root {
        color-scheme: light;
        --font-sans: "Satoshi", "Helvetica Now", "Montserrat", -apple-system,
          BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", sans-serif;
        --font-serif: "Iowan Old Style", "Songti SC", "STSong", "SimSun", serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --page-bg: #f7f7f4;
        --page-ink: #20211f;
        --page-muted: #6b6f68;
        --page-line: #d9ddd4;
        --page-surface: #ffffff;
        --page-max: 1180px;
        --readable-max: 72ch;
        --page-gutter: 18px;
        --page-block: 32px;
        --flow-space: 1.25rem;
        --space-xs: clamp(0.5rem, 0.4rem + 0.3vw, 0.75rem);
        --space-sm: clamp(0.75rem, 0.65rem + 0.5vw, 1rem);
        --space-md: clamp(1rem, 0.85rem + 0.8vw, 1.5rem);
        --space-lg: clamp(1.8rem, 1.3rem + 2vw, 3rem);
        --space-xl: clamp(3rem, 2rem + 5vw, 6rem);
        --step-0: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
        --step-1: clamp(1.2rem, 1.05rem + 0.8vw, 1.55rem);
        --step-2: clamp(1.6rem, 1.2rem + 1.8vw, 2.4rem);
        --step-3: clamp(2.2rem, 1.4rem + 4vw, 4rem);
        --text-small: clamp(0.8rem, 0.2vw + 0.75rem, 0.9rem);
        --text-base: var(--step-0);
        --text-h2: var(--step-2);
        --text-h1: var(--step-3);
        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 24px;
        --ratio-cinema: 2.35 / 1;
        --ratio-landscape: 16 / 9;
        --ratio-portrait: 4 / 5;
        --ratio-square: 1 / 1;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        font-family: var(--font-sans);
        background: var(--page-bg);
        color: var(--page-ink);
      }

      @media (min-width: 48rem) {
        :root {
          --page-gutter: 32px;
          --page-block: 48px;
        }
      }

      @media (min-width: 80rem) {
        :root {
          --page-gutter: 48px;
          --page-block: 64px;
        }
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: 1.6;
        background: var(--page-bg);
        color: var(--page-ink);
        overflow-x: hidden;
      }

      @supports (overflow: clip) {
        body {
          overflow-x: clip;
        }
      }

      :where(main) {
        display: block;
      }

      :where(img, video, canvas, svg, iframe) {
        max-width: 100%;
      }

      :where(img, video, canvas, svg) {
        height: auto;
      }

      :where(img, video) {
        display: block;
      }

      :where(a) {
        color: inherit;
        text-underline-offset: 0.18em;
      }

      :where(p, li, blockquote, figcaption) {
        overflow-wrap: anywhere;
      }

      :where(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
    }

    @layer utilities {
      :where(.moodboard-page, .shell) {
        width: min(var(--page-max), calc(100% - (var(--page-gutter) * 2)));
        margin-inline: auto;
        padding-inline: max(0px, var(--safe-left)) max(0px, var(--safe-right));
      }

      :where(.moodboard-page) {
        padding-block: calc(var(--page-block) + var(--safe-top)) calc(var(--page-block) + var(--safe-bottom));
      }

      :where(.moodboard-canvas) {
        display: block;
        width: 100%;
        min-height: 100vh;
        padding-inline: max(0px, var(--safe-left)) max(0px, var(--safe-right));
      }

      :where(.prose, .readable) {
        max-width: var(--readable-max);
      }

      :where(.stack, .flow) > * + * {
        margin-block-start: var(--stack-space, var(--flow-space));
      }

      :where(.cluster) {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--cluster-gap, var(--space-sm));
      }

      :where(.grid) {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--grid-min, 16rem)), 1fr));
        gap: var(--grid-gap, var(--space-md));
      }

      :where(.bleed) {
        width: min(100vw, calc(100% + (var(--page-gutter) * 2)));
        margin-inline: max(calc(var(--page-gutter) * -1), calc((100% - 100vw) / 2));
      }

      :where(.full-bleed) {
        width: 100%;
      }

      :where(.fullscreen) {
        min-height: 100svh;
      }

      :where(.media-box) {
        display: block;
        overflow: hidden;
        aspect-ratio: var(--media-ratio, auto);
        border-radius: var(--media-radius, var(--radius-sm));
        background: var(--page-line);
      }

      :where(.media-box > img, .media-box > video) {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      :where(.media-fluid) {
        width: 100%;
        height: auto;
      }

      :where(.caption) {
        color: var(--page-muted);
        font-size: var(--text-small);
        line-height: 1.45;
      }

      :where(.ratio-cinema) {
        --media-ratio: var(--ratio-cinema);
        aspect-ratio: var(--ratio-cinema);
      }

      :where(.ratio-landscape) {
        --media-ratio: var(--ratio-landscape);
        aspect-ratio: var(--ratio-landscape);
      }

      :where(.ratio-portrait) {
        --media-ratio: var(--ratio-portrait);
        aspect-ratio: var(--ratio-portrait);
      }

      :where(.ratio-square) {
        --media-ratio: var(--ratio-square);
        aspect-ratio: var(--ratio-square);
      }

      :where(.grid-sync) {
        display: grid;
        grid-row: span var(--grid-sync-span, 3);
        grid-template-rows: subgrid;
      }

      :where(.swatch-row) {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs);
      }

      :where(.swatch-row > *) {
        min-width: var(--swatch-size, 2.5rem);
        min-height: var(--swatch-size, 2.5rem);
        border: 1px solid color-mix(in srgb, var(--page-line), transparent 25%);
        border-radius: var(--radius-sm);
      }

      :where(.snap-row) {
        display: grid;
        grid-auto-columns: minmax(min(78vw, 18rem), 1fr);
        grid-auto-flow: column;
        gap: var(--space-sm);
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline proximity;
        padding-block-end: var(--space-xs);
      }

      :where(.snap-row > *) {
        scroll-snap-align: start;
      }

      :where(.avoid-break) {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      :where(.page-break) {
        break-before: page;
        page-break-before: always;
      }

      :where(.screen-only) {
        display: revert;
      }

      :where(.print-only) {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media print {
      :root {
        --page-gutter: 0px;
        --page-block: 0px;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      *,
      *::before,
      *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }

      html,
      body {
        width: auto;
        min-height: auto;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      :where(.moodboard-page, .shell, main) {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      :where(a) {
        text-decoration: none;
      }

      :where(h1, h2, h3, h4, h5, h6) {
        break-after: avoid;
        page-break-after: avoid;
      }

      :where(p, blockquote, li) {
        orphans: 3;
        widows: 3;
      }

      :where(img, video, figure, table, pre, blockquote, section, article, .avoid-break) {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      :where(.screen-only, .no-print) {
        display: none !important;
      }

      :where(.print-only) {
        display: revert;
      }

      @page {
        margin: 14mm;
      }
    }
  </style>
</head>
<body data-project-id="{{PROJECT_ID}}" data-project-dir="{{PROJECT_DIR_NAME}}" data-created-at="{{PROJECT_CREATED_AT}}" data-updated-at="{{PROJECT_UPDATED_AT}}">

</body>
</html>
