<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{PROJECT_TITLE}}</title>
  <meta name="moodboard-project-id" content="{{PROJECT_ID}}">
  <meta name="moodboard-project-dir" content="{{PROJECT_DIR_NAME}}">
  <meta name="moodboard-created-at" content="{{PROJECT_CREATED_AT}}">
  <meta name="moodboard-updated-at" content="{{PROJECT_UPDATED_AT}}">
  <!--
    Moodboard Explore contract:
    - create_project.py renders PROJECT_* placeholders only when the project is first created.
    - Future skill runs replace only the body element contents.
    - The document head is a stable technical shell; project-specific visual design belongs in body.
  -->
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f7f7f4;
      --page-ink: #20211f;
      --page-muted: #6b6f68;
      --page-line: #d9ddd4;
      --page-surface: #ffffff;
      --page-max: 1180px;
      --readable-max: 72ch;
      --page-gutter: 18px;
      --page-block: 32px;
      --flow-space: 1.25rem;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--page-bg);
      color: var(--page-ink);
    }

    @media (min-width: 48rem) {
      :root {
        --page-gutter: 32px;
        --page-block: 48px;
      }
    }

    @media (min-width: 80rem) {
      :root {
        --page-gutter: 48px;
        --page-block: 64px;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.6;
      background: var(--page-bg);
      color: var(--page-ink);
      overflow-x: hidden;
    }

    @supports (overflow: clip) {
      body {
        overflow-x: clip;
      }
    }

    :where(img, video, canvas, svg, iframe) {
      max-width: 100%;
    }

    :where(img, video, canvas, svg) {
      height: auto;
    }

    :where(img, video) {
      display: block;
    }

    :where(a) {
      color: inherit;
      text-underline-offset: 0.18em;
    }

    :where(p, li, blockquote, figcaption) {
      overflow-wrap: anywhere;
    }

    :where(.moodboard-page, main) {
      width: min(var(--page-max), calc(100% - (var(--page-gutter) * 2)));
      margin-inline: auto;
      padding-block: calc(var(--page-block) + var(--safe-top)) calc(var(--page-block) + var(--safe-bottom));
      padding-inline: max(0px, var(--safe-left)) max(0px, var(--safe-right));
    }

    :where(.readable) {
      max-width: var(--readable-max);
    }

    :where(.flow > * + *) {
      margin-block-start: var(--flow-space);
    }

    :where(.media-fluid) {
      width: 100%;
      height: auto;
    }

    :where(.avoid-break) {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    :where(.page-break) {
      break-before: page;
      page-break-before: always;
    }

    :where(.print-only) {
      display: none;
    }

    :where(:focus-visible) {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media print {
      :root {
        background: #ffffff;
        color: #000000;
        --page-bg: #ffffff;
        --page-ink: #000000;
        --page-gutter: 0px;
        --page-block: 0px;
      }

      *,
      *::before,
      *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }

      html,
      body {
        width: auto;
        min-height: auto;
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
      }

      :where(.moodboard-page, main) {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      :where(a) {
        text-decoration: none;
      }

      :where(h1, h2, h3, h4, h5, h6) {
        break-after: avoid;
        page-break-after: avoid;
      }

      :where(p, blockquote, li) {
        orphans: 3;
        widows: 3;
      }

      :where(img, video, figure, table, pre, blockquote, section, article, .avoid-break) {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      :where(.screen-only, .no-print) {
        display: none !important;
      }

      :where(.print-only) {
        display: revert;
      }

      @page {
        margin: 14mm;
      }
    }
  </style>
</head>
<body data-project-id="{{PROJECT_ID}}" data-project-dir="{{PROJECT_DIR_NAME}}" data-created-at="{{PROJECT_CREATED_AT}}" data-updated-at="{{PROJECT_UPDATED_AT}}">

</body>
</html>
