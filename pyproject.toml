[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-app-agent"
version = "0.1.0"
description = "Local CLI for Eagle moodboard tagging."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
moodtag = "moodtag.cli:main"

[tool.setuptools.packages.find]
include = ["moodtag*", "moodtag_core*"]

[tool.setuptools.package-data]
"moodtag_core.resources.prompts" = ["*.txt"]
"moodtag_core.resources.taxonomy" = ["*.json"]
