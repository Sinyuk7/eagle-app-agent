[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-app-agent"
version = "0.1.3"
description = "Local CLI for Eagle moodboard tagging."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Sinyuk7" },
]
keywords = ["eagle", "moodboard", "tagging", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]
dependencies = [
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Sinyuk7/eagle-app-agent"
Repository = "https://github.com/Sinyuk7/eagle-app-agent"
Issues = "https://github.com/Sinyuk7/eagle-app-agent/issues"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.11",
  "twine>=6.0",
]

[project.scripts]
moodtag = "moodtag.cli:main"
moodboard = "moodboard.cli:main"
moodboard-layout = "moodboard_core.layout:main"

[tool.setuptools.packages.find]
include = ["moodtag*", "moodtag_core*", "moodboard*", "moodboard_core*"]

[tool.setuptools.package-data]
"moodtag_core.resources.prompts" = ["*.txt"]
"moodtag_core.resources.taxonomy" = ["*.json"]
"moodboard_core.resources.templates" = ["*.html"]
"moodboard_core.resources.specs" = ["*.md"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
